<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fde-kit · 现场交付底座</title>
<style>
  :root{
    --bg:#f6f6f3; --panel:#ffffff; --line:#e5e4de; --line-soft:#eeede8;
    --ink:#1f2328; --ink-2:#5f5e5a; --ink-3:#8c8b84;
    --accent:#0f6e56; --accent-soft:#e1f5ee; --accent-line:#9fe1cb;
    --warn:#a15c00; --warn-soft:#faeeda; --bad:#a32d2d; --bad-soft:#fcebeb;
    --radius:12px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
  }
  button{font-family:inherit;font-size:13px;cursor:pointer;border-radius:8px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);padding:7px 12px;transition:background .12s,border-color .12s}
  button:hover{background:#fafaf7;border-color:#d6d5cd}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:#0c5b47}
  button.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
  button.ghost:hover{background:#eeede8;color:var(--ink)}

  header{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:16px;
    padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:9px}
  .brand svg{display:block}
  .brand b{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .brand span{color:var(--ink-3);font-size:12px}
  .chips{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;
    background:#f4f4f0;color:var(--ink-2);font-size:12px;border:1px solid var(--line-soft)}
  .chip b{color:var(--ink);font-weight:600}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .dot.off{background:var(--warn)}

  main{flex:1;display:grid;grid-template-columns:276px minmax(0,1fr) 348px;gap:12px;padding:12px;
    min-height:0}
  .col{min-height:0;display:flex;flex-direction:column;gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .card-h{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line-soft)}
  .card-h h2{margin:0;font-size:13px;font-weight:600}
  .card-h .sub{color:var(--ink-3);font-size:11px;margin-left:auto}
  .card-b{padding:12px 13px;overflow:auto;min-height:0;flex:1}
  .card-b.tight{padding:8px 9px}

  .asset{display:flex;gap:8px;padding:7px 8px;border-radius:8px;cursor:default}
  .asset:hover{background:#fafaf7}
  .asset .ext{flex:0 0 34px;height:20px;border-radius:4px;background:#f1f0ea;color:var(--ink-3);
    font-size:10px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);
    text-transform:uppercase;margin-top:2px}
  .asset .t{font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .asset .m{font-size:11px;color:var(--ink-3);font-family:var(--mono)}

  .progress{height:4px;border-radius:2px;background:#eeede8;overflow:hidden;margin:8px 0 6px}
  .progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
  .hint{font-size:11.5px;color:var(--ink-3)}

  .onto{display:flex;align-items:center;gap:8px;padding:5px 4px;font-size:12px}
  .onto .name{flex:1;color:var(--ink-2)}
  .onto .n{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
  .badge{font-size:10.5px;padding:1px 6px;border-radius:999px;background:var(--accent-soft);
    color:var(--accent);border:1px solid var(--accent-line)}
  .badge.miss{background:var(--warn-soft);color:var(--warn);border-color:#fac775}

  .chat{flex:1;display:flex;flex-direction:column;min-height:0}
  .msgs{flex:1;overflow:auto;padding:18px 20px 8px;display:flex;flex-direction:column;gap:18px}
  .msg{display:flex;gap:10px;max-width:100%}
  .msg .avatar{flex:0 0 24px;height:24px;border-radius:6px;background:var(--accent-soft);
    color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;
    font-weight:600;margin-top:2px}
  .msg.user .avatar{background:#f1f0ea;color:var(--ink-2)}
  .msg .body{min-width:0}
  .msg .body p{margin:0 0 8px}
  .msg .body p:last-child{margin-bottom:0}
  .msg .body ul{margin:4px 0 8px;padding-left:18px}
  .msg .body li{margin:2px 0}
  .msg.user .body{background:#f4f4f0;border-radius:10px;padding:8px 11px}
  .cite-chip{display:inline-block;padding:0 5px;margin:0 1px;border-radius:4px;background:var(--accent-soft);
    color:var(--accent);border:1px solid var(--accent-line);font-family:var(--mono);font-size:11px;
    cursor:pointer;vertical-align:baseline;line-height:1.5}
  .cite-chip:hover{background:#cdeee2}
  .meta{display:flex;gap:10px;align-items:center;margin-top:8px;color:var(--ink-3);font-size:11px}
  .meta .pill{padding:1px 7px;border-radius:999px;background:#f4f4f0;border:1px solid var(--line-soft)}
  .trace{margin-top:6px;border-left:2px solid var(--line);padding-left:10px;color:var(--ink-3);
    font-size:11.5px;font-family:var(--mono);display:none}
  .trace.on{display:block}
  .trace div{margin:2px 0}
  .trace b{color:var(--ink-2);font-weight:500}

  .composer{border-top:1px solid var(--line-soft);padding:10px 12px 12px;background:var(--panel)}
  .input-wrap{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--line);
    border-radius:10px;padding:6px 6px 6px 10px;background:#fdfdfb}
  .input-wrap:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 3px rgba(15,110,86,.06)}
  textarea{flex:1;border:0;outline:0;resize:none;font:inherit;font-size:13.5px;background:transparent;
    max-height:120px;min-height:22px;line-height:1.5;padding:4px 0}
  .sugg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .sugg button{font-size:11.5px;padding:4px 9px;border-radius:999px;color:var(--ink-2);background:#f7f7f3}

  .empty{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
    gap:10px;color:var(--ink-3);padding:0 24px;text-align:center}
  .empty h3{margin:0;font-size:15px;font-weight:600;color:var(--ink)}
  .empty p{margin:0;font-size:12.5px;max-width:420px}

  .budget{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-3);margin-bottom:10px}
  .budget .bar{flex:1;height:5px;border-radius:3px;background:#eeede8;overflow:hidden}
  .budget .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .budget.warn .bar i{background:var(--warn)}

  .cite{padding:9px 9px;border:1px solid var(--line-soft);border-radius:9px;margin-bottom:8px;
    cursor:pointer;transition:border-color .12s,background .12s}
  .cite:hover{border-color:var(--accent-line);background:#fbfdfc}
  .cite.hl{border-color:var(--accent);background:var(--accent-soft)}
  .cite .top{display:flex;align-items:center;gap:7px;margin-bottom:4px}
  .cite .sid{font-family:var(--mono);font-size:10.5px;padding:1px 5px;border-radius:4px;
    background:var(--accent);color:#fff}
  .cite .name{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cite .sec{font-size:11px;color:var(--ink-3);margin-bottom:4px}
  .cite .quote{font-size:11.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;
    -webkit-box-orient:vertical;overflow:hidden}
  .cite .foot{display:flex;align-items:center;gap:6px;margin-top:6px}
  .cite .bar{flex:1;height:3px;border-radius:2px;background:#eeede8;overflow:hidden}
  .cite .bar i{display:block;height:100%;background:var(--accent-line)}
  .cite .score{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}

  .notes{margin:0;padding:0;list-style:none;font-size:11.5px;color:var(--ink-2)}
  .notes li{padding:3px 0;border-bottom:1px dashed var(--line-soft)}
  .notes li:last-child{border:0}

  .overlay{position:absolute;inset:0;background:rgba(31,35,40,.28);display:none;
    align-items:center;justify-content:center;padding:40px;z-index:20}
  .overlay.on{display:flex}
  .modal{background:var(--panel);border-radius:14px;border:1px solid var(--line);width:min(860px,100%);
    max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.12)}
  .modal-h{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line-soft)}
  .modal-h h3{margin:0;font-size:14px;font-weight:600}
  .modal-h .x{margin-left:auto}
  .modal-b{padding:16px;overflow:auto}
  table.metrics{border-collapse:collapse;width:100%;font-size:12px}
  table.metrics th{text-align:left;background:#f7f7f3;font-weight:600;padding:7px 9px;
    border:1px solid var(--line-soft)}
  table.metrics td{padding:7px 9px;border:1px solid var(--line-soft)}
  table.metrics tr:nth-child(even) td{background:#fcfcfa}
  .kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  .kpi div{border:1px solid var(--line-soft);border-radius:9px;padding:9px 11px;background:#fbfbf8}
  .kpi .v{font-size:19px;font-weight:600;letter-spacing:-.02em}
  .kpi .l{font-size:11px;color:var(--ink-3)}
  .ok{color:var(--accent)}.no{color:var(--bad)}
  body{position:relative}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#dcdbd4;border-radius:5px;border:2px solid var(--panel)}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <rect x="1" y="1" width="22" height="22" rx="6" fill="#0f6e56"/>
      <path d="M7 7h10M7 12h7M7 17h4" stroke="#e1f5ee" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="17" cy="16.5" r="2.2" fill="#9fe1cb"/>
    </svg>
    <div>
      <b>fde-kit</b>
      <span style="margin-left:8px">现场交付底座</span>
    </div>
  </div>
  <div class="chips">
    <span class="chip"><i class="dot" id="modeDot"></i><span id="modeText">连接中</span></span>
    <span class="chip">资料 <b id="cAssets">–</b></span>
    <span class="chip">分块 <b id="cChunks">–</b></span>
    <span class="chip">实体 <b id="cEntities">–</b></span>
    <button class="ghost" id="btnEval">跑评测</button>
    <button id="btnReport">交付报告</button>
  </div>
</header>

<main>
  <div class="col">
    <div class="card" style="flex:0 0 auto">
      <div class="card-h"><h2>知识库</h2><span class="sub" id="revText">r0</span></div>
      <div class="card-b" style="flex:0 0 auto;padding-bottom:4px">
        <button class="primary" id="btnCompile" style="width:100%">编译资料</button>
        <div class="progress" id="compileProgress" style="display:none"><i></i></div>
        <div class="hint" id="compileHint">编译后才有证据可检索</div>
      </div>
    </div>
    <div class="card" style="flex:1">
      <div class="card-h"><h2>语料</h2><span class="sub" id="assetsSub"></span></div>
      <div class="card-b tight" id="assetList"></div>
    </div>
    <div class="card" style="flex:0 0 auto;max-height:34%">
      <div class="card-h"><h2>本体覆盖</h2><span class="sub" id="ontoName"></span></div>
      <div class="card-b" id="ontoList"></div>
    </div>
  </div>

  <div class="col">
    <div class="card chat">
      <div class="msgs" id="msgs">
        <div class="empty" id="empty">
          <h3>先编译资料，再问一个真问题</h3>
          <p>fde-kit 的每条回答都必须落在具体证据上。问完可以点引用编号，右侧会显示它到底出自哪一段。</p>
        </div>
      </div>
      <div class="composer">
        <div class="sugg" id="sugg">
          <button>A100 的保修期是多久？</button>
          <button>E021 故障码怎么处理？</button>
          <button>2024 年 3 月出货的设备还能退货吗？</button>
        </div>
        <div class="input-wrap">
          <textarea id="q" rows="1" placeholder="问一个客户现场真会问的问题…"></textarea>
          <button class="primary" id="btnAsk">发送</button>
        </div>
      </div>
    </div>
  </div>

  <div class="col">
    <div class="card" style="flex:0 0 auto">
      <div class="card-h"><h2>上下文包</h2><span class="sub" id="bundleSub">未检索</span></div>
      <div class="card-b" style="flex:0 0 auto">
        <div class="budget" id="budgetWrap">
          <span id="budgetText">0 / 0 tokens</span>
          <span class="bar"><i id="budgetBar"></i></span>
        </div>
        <div id="cites"><div class="hint">提问后这里会列出本次喂给模型的全部证据、得分与预算占用。</div></div>
      </div>
    </div>
    <div class="card" style="flex:1">
      <div class="card-h"><h2>执行轨迹</h2><span class="sub">agent trace</span></div>
      <div class="card-b" id="tracePanel">
        <ul class="notes" id="notes"><li class="hint" style="border:0;color:var(--ink-3)">暂无</li></ul>
      </div>
    </div>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-h"><h3 id="modalTitle">评测结果</h3><button class="ghost x" id="btnClose">关闭</button></div>
    <div class="modal-b" id="modalBody"></div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls;
  if (html !== undefined) n.innerHTML = html; return n; };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let CONFIG = null;
let currentCites = [];

async function jget(url){ const r = await fetch(url); if(!r.ok) throw new Error(await r.text()); return r.json(); }
async function jpost(url, body){ const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"},
  body: JSON.stringify(body||{})}); if(!r.ok) throw new Error(await r.text()); return r.json(); }

async function loadAll(){
  try{
    CONFIG = await jget("/api/config");
    const s = CONFIG.settings;
    $("#modeText").textContent = s.mode === "online" ? ("在线 · " + (s.llm_model||"模型")) : "离线 · 抽取式";
    $("#modeDot").className = "dot" + (s.mode === "online" ? "" : " off");
    const st = await jget("/api/stats");
    $("#cAssets").textContent = st.assets;
    $("#cChunks").textContent = st.chunks;
    $("#cEntities").textContent = st.entities;
    $("#revText").textContent = "r" + st.revision;
    $("#assetsSub").textContent = st.chunks + " 块 · " + st.tokens.toLocaleString() + " tokens";
    await loadAssets();
    await loadOntology();
  }catch(e){ console.error(e); }
}

async function loadAssets(){
  const list = await jget("/api/assets");
  const box = $("#assetList"); box.innerHTML = "";
  if(!list.length){ box.appendChild(el("div","hint","还没有编译任何资料。点击上方“编译资料”，或先跑 fde compile。")); return; }
  list.forEach(a => {
    const row = el("div","asset");
    row.appendChild(el("div","ext", esc((a.media_type||"").slice(0,4))));
    const mid = el("div"); mid.style.minWidth = "0"; mid.style.flex = "1";
    mid.appendChild(el("div","t", esc(a.title)));
    mid.appendChild(el("div","m", a.chunks + " 块 · " + Math.round(a.size/1024) + " KB"));
    row.appendChild(mid); box.appendChild(row);
  });
}

async function loadOntology(){
  try{
    const o = await jget("/api/ontology");
    $("#ontoName").textContent = o.name + " v" + o.version;
    const box = $("#ontoList"); box.innerHTML = "";
    (o.coverage||[]).forEach(c => {
      const row = el("div","onto");
      row.appendChild(el("span","name", esc(c.type) + (c.description ? " · " + esc(c.description) : "")));
      row.appendChild(el("span","n", c.hits));
      row.appendChild(el("span","badge" + (c.covered ? "" : " miss"), c.covered ? "命中" : "未覆盖"));
      box.appendChild(row);
    });
    if(!(o.coverage||[]).length) box.appendChild(el("div","hint","未加载本体，仅通用切块。"));
  }catch(e){}
}

async function doCompile(){
  const btn = $("#btnCompile"); btn.disabled = true; btn.textContent = "编译中…";
  $("#compileProgress").style.display = "block";
  try{
    const {job_id} = await jpost("/api/compile", {reset:false});
    await pollJob(job_id, (j) => {
      const pct = j.total ? Math.round(j.done / j.total * 100) : 12;
      $("#compileProgress").firstElementChild.style.width = pct + "%";
      $("#compileHint").textContent = j.stage + " · " + (j.message || "");
    });
    $("#compileHint").textContent = "编译完成";
    await loadAll();
  }catch(e){ $("#compileHint").textContent = "编译失败：" + e.message; }
  finally{ btn.disabled = false; btn.textContent = "编译资料";
    setTimeout(()=>{ $("#compileProgress").style.display="none"; }, 900); }
}

async function pollJob(id, onTick){
  for(;;){
    const j = await jget("/api/jobs/" + id);
    if(onTick) onTick(j);
    if(j.status === "done") return j;
    if(j.status === "error") throw new Error(j.error || "任务失败");
    await new Promise(r => setTimeout(r, 450));
  }
}

function mdLite(text){
  let html = esc(text);
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/\[(S\d+)\]/g, '<span class="cite-chip" data-sid="$1">$1</span>');
  const lines = html.split(/\n{2,}/).map(block => {
    const parts = block.split("\n");
    if(parts.every(p => /^\s*[-*]\s+/.test(p))){
      return "<ul>" + parts.map(p => "<li>" + p.replace(/^\s*[-*]\s+/,"") + "</li>").join("") + "</ul>";
    }
    return "<p>" + parts.join("<br>") + "</p>";
  });
  return lines.join("");
}

function addMsg(role, text){
  const empty = $("#empty"); if(empty) empty.remove();
  const msg = el("div","msg " + role);
  msg.appendChild(el("div","avatar", role === "user" ? "我" : "F"));
  const body = el("div","body");
  body.innerHTML = role === "user" ? "<p>" + esc(text) + "</p>" : mdLite(text);
  msg.appendChild(body);
  $("#msgs").appendChild(msg);
  $("#msgs").scrollTop = $("#msgs").scrollHeight;
  return {msg, body};
}

function renderCites(citations){
  currentCites = citations || [];
  const box = $("#cites"); box.innerHTML = "";
  if(!currentCites.length){ box.appendChild(el("div","hint","本轮没有检索到可用证据。")); return; }
  const max = Math.max(...currentCites.map(c => c.score || 0), 0.0001);
  currentCites.forEach(c => {
    const card = el("div","cite"); card.dataset.sid = c.sid;
    const top = el("div","top");
    top.appendChild(el("span","sid", c.sid));
    top.appendChild(el("span","name", esc(c.title)));
    card.appendChild(top);
    if(c.section) card.appendChild(el("div","sec", esc(c.section)));
    card.appendChild(el("div","quote", esc(c.quote)));
    const foot = el("div","foot");
    const bar = el("div","bar"); const fill = el("i");
    fill.style.width = Math.max(6, Math.round((c.score||0)/max*100)) + "%";
    bar.appendChild(fill);
    foot.appendChild(bar);
    foot.appendChild(el("span","score", (c.score||0).toFixed(4)));
    card.appendChild(foot);
    card.onclick = () => { document.querySelectorAll(".cite").forEach(n=>n.classList.remove("hl"));
      card.classList.add("hl"); };
    box.appendChild(card);
  });
}

function renderNotes(notes){
  const ul = $("#notes"); ul.innerHTML = "";
  const items = (notes && notes.length) ? notes : ["暂无"];
  items.forEach(n => ul.appendChild(el("li", "", esc(n))));
}

function pushTrace(node, detail){
  const ul = $("#notes");
  if(ul.dataset.started !== "1"){ ul.innerHTML = ""; ul.dataset.started = "1"; }
  ul.appendChild(el("li", "", "<b>" + esc(node) + "</b> " + esc(detail)));
}

function updateBudget(bundle){
  if(!bundle) return;
  const pct = Math.min(100, Math.round((bundle.tokens_used||0) / Math.max(1,bundle.token_budget) * 100));
  $("#budgetBar").style.width = pct + "%";
  $("#budgetText").textContent = bundle.tokens_used + " / " + bundle.token_budget + " tokens";
  $("#budgetWrap").className = "budget" + (pct > 92 ? " warn" : "");
  $("#bundleSub").textContent = (bundle.citations||[]).length + " 段证据 · " + (bundle.dropped ? "丢弃 " + bundle.dropped : "全部装入");
  renderNotes(bundle.notes);
}

async function ask(q){
  if(!q.trim()) return;
  const btn = $("#btnAsk"); btn.disabled = true;
  addMsg("user", q);
  $("#q").value = ""; $("#q").style.height = "auto";
  $("#notes").dataset.started = "0";
  const {body} = addMsg("agent", "");
  body.innerHTML = '<p style="color:#8c8b84">检索中…</p>';
  let buffer = "";
  try{
    const resp = await fetch("/api/ask/stream?q=" + encodeURIComponent(q) + "&session_id=default");
    if(!resp.ok) throw new Error(await resp.text());
    const reader = resp.body.getReader(); const dec = new TextDecoder(); let rest = "";
    for(;;){
      const {value, done} = await reader.read(); if(done) break;
      rest += dec.decode(value, {stream:true});
      const parts = rest.split("\n\n"); rest = parts.pop();
      for(const part of parts){
        const line = part.trim(); if(!line.startsWith("data:")) continue;
        const ev = JSON.parse(line.slice(5).trim());
        if(ev.type === "trace"){ pushTrace(ev.node, ev.detail); }
        else if(ev.type === "citations"){ renderCites(ev.citations); }
        else if(ev.type === "token"){ buffer += ev.text; body.innerHTML = mdLite(buffer) ||
          '<p style="color:#8c8b84">生成中…</p>'; $("#msgs").scrollTop = $("#msgs").scrollHeight; }
        else if(ev.type === "error"){ body.innerHTML = '<p class="no">出错：' + esc(ev.message) + "</p>"; }
        else if(ev.type === "done"){
          const a = ev.answer;
          body.innerHTML = mdLite(a.text);
          const meta = el("div","meta");
          meta.innerHTML = '<span class="pill">' + (a.mode === "llm" ? "模型生成" : a.mode === "extractive" ? "抽取式" : "无证据") +
            '</span><span class="pill">' + (a.grounded ? "有据可依" : "证据不足") +
            '</span><span>置信度 ' + a.confidence.toFixed(2) + '</span><span>' +
            (a.citations||[]).length + ' 段引用</span>';
          body.appendChild(meta);
          updateBudget(a.bundle);
          if(a.bundle && a.bundle.citations) renderCites(a.bundle.citations);
        }
      }
    }
  }catch(e){ body.innerHTML = '<p class="no">请求失败：' + esc(e.message) + "</p>"; }
  finally{ btn.disabled = false; }
}

async function doEval(){
  $("#overlay").classList.add("on");
  $("#modalTitle").textContent = "评测中…";
  $("#modalBody").innerHTML = '<div class="hint">逐条跑评测集，同时计算纯 BM25 基线做对照。</div>';
  try{
    const {job_id, cases, k} = await jpost("/api/eval", {k:5});
    const job = await pollJob(job_id, (j) => {
      $("#modalBody").innerHTML = '<div class="hint">' + Math.round(j.done/Math.max(1,j.total)*100) + "% · " + esc(j.message) + "</div>";
    });
    renderEval(job.result);
  }catch(e){ $("#modalBody").innerHTML = '<p class="no">评测失败：' + esc(e.message) + "</p>"; }
}

function renderEval(run){
  if(!run){ return; }
  $("#modalTitle").textContent = "评测结果 · " + run.summary.cases + " 条用例";
  const s = run.summary;
  const kpi = '<div class="kpi">' +
    '<div><div class="v">' + (s.hit_rate*100).toFixed(0) + '%</div><div class="l">hit@' + run.k + '（词法基线 ' + (s.lexical_hit_rate*100).toFixed(0) + '%）</div></div>' +
    '<div><div class="v">' + s.mrr.toFixed(3) + '</div><div class="l">MRR（词法基线 ' + s.lexical_mrr.toFixed(3) + '）</div></div>' +
    '<div><div class="v">' + (s.keyword_coverage*100).toFixed(0) + '%</div><div class="l">关键词覆盖</div></div>' +
    '<div><div class="v">' + (s.citation_validity*100).toFixed(0) + '%</div><div class="l">引用有效率</div></div>' +
    '</div>';
  let rows = (run.results||[]).map(r =>
    "<tr><td>" + esc(r.id) + "</td><td>" + esc(r.question) + "</td><td class='" + (r.hit?"ok":"no") + "'>" + (r.hit?"✓":"✗") +
    "</td><td>" + r.mrr.toFixed(2) + "</td><td>" + (r.keyword_coverage*100).toFixed(0) + "%</td><td class='" +
    (r.grounded?"ok":"no") + "'>" + (r.grounded?"✓":"✗") + "</td><td>" + r.latency_ms + " ms</td></tr>").join("");
  $("#modalBody").innerHTML = kpi + '<table class="metrics"><thead><tr><th>用例</th><th>问题</th><th>召回</th>' +
    '<th>MRR</th><th>覆盖</th><th>有据</th><th>延迟</th></tr></thead><tbody>' + rows + "</tbody></table>";
}

async function doReport(){
  try{
    await jpost("/api/report", {});
    window.open("/api/report/view", "_blank");
  }catch(e){ alert("生成失败：" + e.message); }
}

$("#btnCompile").onclick = doCompile;
$("#btnEval").onclick = doEval;
$("#btnReport").onclick = doReport;
$("#btnClose").onclick = () => $("#overlay").classList.remove("on");
$("#overlay").onclick = (e) => { if(e.target.id === "overlay") $("#overlay").classList.remove("on"); };
$("#btnAsk").onclick = () => ask($("#q").value);
$("#q").addEventListener("keydown", (e) => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); ask($("#q").value); }
});
$("#q").addEventListener("input", (e) => {
  e.target.style.height = "auto"; e.target.style.height = Math.min(120, e.target.scrollHeight) + "px";
});
$("#sugg").addEventListener("click", (e) => { if(e.target.tagName === "BUTTON") ask(e.target.textContent); });
document.addEventListener("click", (e) => {
  const chip = e.target.closest(".cite-chip"); if(!chip) return;
  const sid = chip.dataset.sid;
  document.querySelectorAll(".cite").forEach(n => n.classList.toggle("hl", n.dataset.sid === sid));
  const target = document.querySelector('.cite[data-sid="' + sid + '"]');
  if(target) target.scrollIntoView({block:"nearest", behavior:"smooth"});
});
loadAll();
</script>
